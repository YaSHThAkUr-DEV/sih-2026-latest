version: '3.8'

networks:
  dms-fabric-network:
    name: dms-fabric-network
    driver: bridge

volumes:
  orderer.dms.gov.in:
  peer0.org1.dms.gov.in:
  couchdb0:
  ca.org1.dms.gov.in:

services:
  # ---------------------------------------------------------------------------
  # 1. Fabric Certificate Authority (CA)
  # ---------------------------------------------------------------------------
  ca.org1.dms.gov.in:
    image: hyperledger/fabric-ca:1.5.7
    container_name: ca.org1.dms.gov.in
    mem_limit: 128m
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    volumes:
      - ca.org1.dms.gov.in:/etc/hyperledger/fabric-ca-server
    networks:
      - dms-fabric-network

  # ---------------------------------------------------------------------------
  # 2. CouchDB State Database for Peer0
  # ---------------------------------------------------------------------------
  couchdb0:
    image: couchdb:3.3.2
    container_name: couchdb0
    mem_limit: 256m
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb0:/opt/couchdb/data
    networks:
      - dms-fabric-network

  # ---------------------------------------------------------------------------
  # 3. Orderer Node (Solo / Raft Consensus)
  # ---------------------------------------------------------------------------
  orderer.dms.gov.in:
    image: hyperledger/fabric-orderer:2.5.4
    container_name: orderer.dms.gov.in
    mem_limit: 200m
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=false
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    volumes:
      - orderer.dms.gov.in:/var/hyperledger/production/orderer
      - ./crypto-config/ordererOrganizations/dms.gov.in/msp:/var/hyperledger/orderer/msp
    networks:
      - dms-fabric-network

  # ---------------------------------------------------------------------------
  # 4. Peer0 (Organization 1 - DMS Gov)
  # ---------------------------------------------------------------------------
  peer0.org1.dms.gov.in:
    image: hyperledger/fabric-peer:2.5.4
    container_name: peer0.org1.dms.gov.in
    mem_limit: 380m
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=dms-fabric-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_ID=peer0.org1.dms.gov.in
      - CORE_PEER_ADDRESS=peer0.org1.dms.gov.in:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.dms.gov.in:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.dms.gov.in:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.dms.gov.in:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "7051:7051"
      - "7052:7052"
    volumes:
      - peer0.org1.dms.gov.in:/var/hyperledger/production
      - ./crypto-config/peerOrganizations/org1.dms.gov.in/msp:/etc/hyperledger/fabric/msp
    depends_on:
      - couchdb0
      - orderer.dms.gov.in
    networks:
      - dms-fabric-network
